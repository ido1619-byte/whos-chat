name: Collect clips

on:
  schedule:
    - cron: "17 4 */2 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-clips
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
           ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Collect new clips and their chat
        run: node collector/collect.mjs
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          TWITCH_GQL_CLIENT_ID: ${{ secrets.TWITCH_GQL_CLIENT_ID }}
          TWITCH_GQL_COMMENTS_HASH: ${{ secrets.TWITCH_GQL_COMMENTS_HASH }}

      - name: Save to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Collect clips $(date -u +%Y-%m-%d)"
            git push
          fi
